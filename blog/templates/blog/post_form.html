{% extends 'blog/base.html' %}
{% block title %}{% if editing %}Edit Post{% else %}New Post{% endif %}{% endblock %}
{% block content %}
    <h1>{% if editing %}Edit Post{% else %}Create New Post{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">{% if editing %}Update{% else %}Submit{% endif %}</button>
    </form>
{% endblock %}
