{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'blog:home' %}" class="nav-brand">My Blog</a>

        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'blog:my_posts' %}">My Posts</a>
                <a href="{% url 'blog:create_post' %}">New Post</a>
                <a href="{% url 'blog:my_posts' %}">My Posts</a>
                <span>Hello, {{ user.username }}</span>
                <form method="post" action="{% url 'blog:logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="link-button">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'blog:login' %}">Login</a>
                <a href="{% url 'blog:register' %}">Register</a>
            {% endif %}
        </div>

    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
